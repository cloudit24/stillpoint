name: build-apk
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to publish a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already ships the Android SDK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STILLPOINT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Releases must be signed: KEYSTORE_BASE64 secret is missing." && exit 1
          fi

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -q "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts \
            || { echo "Tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"; exit 1; }

      - name: Build APKs
        env:
          STILLPOINT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STILLPOINT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STILLPOINT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # The checks run first; if one fails, nothing is built or released.
        run: gradle :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:assembleFdroidRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp "$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)" out/stillpoint-github.apk
          cp "$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)" out/stillpoint-fdroid.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: stillpoint-apks
          path: out/*.apk

      # Only the GitHub build is attached: the in-app updater installs the first .apk it finds.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/stillpoint-github.apk "out/stillpoint-${GITHUB_REF_NAME}.apk"
          # Same file under a fixed name, so .../releases/latest/download/Stillpoint-Launcher.apk always works.
          cp out/stillpoint-github.apk out/Stillpoint-Launcher.apk
          # Notes: this version's section of CHANGELOG.md, then how to install.
          awk -v v="## ${GITHUB_REF_NAME} " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on && !/\.apk\]/' CHANGELOG.md > notes.md
          printf '\n### Install\nDownload **stillpoint-%s.apk** below (Android 8.0 or newer). Already installed? Update from Settings, Updates.\n\nAll versions: [CHANGELOG.md](https://github.com/cloudit24/stillpoint/blob/main/CHANGELOG.md)\n' "$GITHUB_REF_NAME" >> notes.md
          gh release create "$GITHUB_REF_NAME" "out/stillpoint-${GITHUB_REF_NAME}.apk" out/Stillpoint-Launcher.apk \
            --title "Stillpoint Launcher ${GITHUB_REF_NAME}" --notes-file notes.md
